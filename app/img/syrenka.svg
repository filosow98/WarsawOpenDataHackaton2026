<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Syrenka z tarczą WC">
  <!-- Szkic zastępczy maskotki (docs/14): własna syrenka, nie herb. Ogon w supeł
       = „zaciska krok”, tarcza z WC zamiast tarczy z herbu. Podmienić na projekt. -->
  <g fill="#fff" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ogon: skręcony w supeł, na końcu płetwa -->
    <path d="M84 120 C 70 150, 132 152, 122 178 C 114 198, 76 196, 84 176 C 92 156, 140 166, 150 190"/>
    <path d="M100 122 C 104 140, 140 140, 136 162" fill="none"/>
    <path d="M150 190 C 140 204, 150 214, 162 206 C 166 214, 182 210, 176 196 C 170 186, 158 186, 150 190 Z"/>
    <!-- tułów -->
    <path d="M80 76 Q 96 70 112 76 L 112 116 Q 96 124 82 118 Z"/>
    <!-- ręka zaciśnięta przy ogonie -->
    <path d="M110 84 C 128 96, 126 112, 112 122" fill="none"/>
    <circle cx="111" cy="124" r="5"/>
    <!-- włosy -->
    <path d="M70 52 C 62 28, 84 16, 98 20 C 116 18, 130 34, 122 56 C 130 68, 126 82, 116 80 C 118 66, 112 60, 110 56 L 82 56 C 78 64, 80 74, 72 80 C 62 76, 64 62, 70 52 Z"/>
    <!-- głowa -->
    <circle cx="96" cy="48" r="20"/>
    <!-- tarcza z WC -->
    <path d="M24 84 L 72 84 L 72 116 C 72 134, 56 144, 48 148 C 40 144, 24 134, 24 116 Z"/>
    <path d="M70 100 C 78 96, 82 92, 84 86" fill="none"/>
  </g>
  <text x="48" y="122" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="700" font-size="22" fill="#111">WC</text>
  <!-- mina: zaniepokojone brwi, oczy, falujące usta, kropla potu -->
  <g fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round">
    <path d="M84 40 L 92 37"/><path d="M100 37 L 108 40"/>
    <path d="M88 58 q 4 -4 8 0 q 4 4 8 0"/>
  </g>
  <circle cx="89" cy="46" r="2.8" fill="#111"/><circle cx="103" cy="46" r="2.8" fill="#111"/>
  <path d="M130 28 C 126 36, 124 40, 128 44 C 132 47, 137 43, 135 38 C 134 35, 132 32, 130 28 Z" fill="#fff" stroke="#111" stroke-width="3"/>
</svg>
